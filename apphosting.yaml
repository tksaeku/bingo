# Firebase App Hosting config for the `bingo` backend.
# App Hosting runs the root `npm run build` (server + client) and `npm start`, so one rollout ships both:
# the Express server serves /api/* and the client build.
runConfig:
  minInstances: 0
  maxInstances: 2

env:
  - variable: ADMIN_KEY
    secret: bingo-admin-key
    availability:
      - RUNTIME
  - variable: ANALYTICS_ENABLED
    value: "true"
    availability:
      - RUNTIME
